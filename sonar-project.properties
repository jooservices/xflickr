# Used by the workspace SonarQube scan (scripts/dev/sonar). The scanner sets the project key and host.
sonar.sources=backend,web/src
sonar.tests=backend,web/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/gen/**,web/src/shared/api/zod/**,backend/cmd/**
sonar.coverage.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/blobstoretest/**
sonar.go.coverage.reportPaths=.tmp/xflickr-coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.sourceEncoding=UTF-8
