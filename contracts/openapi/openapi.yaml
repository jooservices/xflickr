openapi: 3.1.0
info:
  title: XFlickr API
  version: 0.0.0
  description: HTTP API shared by the XFlickr backend and web client.
paths:
  /auth/config:
    $ref: ./paths/auth.yaml#/config
  /healthz:
    $ref: ./paths/common.yaml#/healthz
  /auth/register:
    $ref: ./paths/auth.yaml#/register
  /auth/login:
    $ref: ./paths/auth.yaml#/login
  /auth/logout:
    $ref: ./paths/auth.yaml#/logout
  /auth/sessions:
    $ref: ./paths/auth.yaml#/sessions
  /me:
    $ref: ./paths/auth.yaml#/me
  /me/sessions:
    $ref: ./paths/auth.yaml#/me~1sessions
  /me/sessions/{id}:
    $ref: ./paths/auth.yaml#/me~1sessions~1{id}
  /me/password:
    $ref: ./paths/auth.yaml#/me~1password
  /me/sharing:
    $ref: ./paths/sharing.yaml#/setting
  /keys:
    $ref: ./paths/keys.yaml#/collection
  /keys/{id}:
    $ref: ./paths/keys.yaml#/item
  /keys/{id}/quota:
    $ref: ./paths/quota.yaml#/key
  /flickr-accounts/connect:
    $ref: ./paths/flickr_accounts.yaml#/connect
  /flickr-accounts/callback:
    $ref: ./paths/flickr_accounts.yaml#/callback
  /admin/users:
    $ref: ./paths/admin_users.yaml#/collection
  /admin/users/{id}:
    $ref: ./paths/admin_users.yaml#/item
  /admin/plans:
    $ref: ./paths/plans.yaml#/collection
  /admin/users/{id}/plan:
    $ref: ./paths/plans.yaml#/user_plan
  /me/crawl/queue:
    $ref: ./paths/queue.yaml#/user_queue
  /me/crawl:
    $ref: ./paths/crawl.yaml#/status
  /me/contacts/{nsid}/star:
    $ref: ./paths/crawl.yaml#/star
  /me/contacts/{nsid}/select:
    $ref: ./paths/crawl.yaml#/select
  /me/crawl/pause:
    $ref: ./paths/crawl.yaml#/pause
  /me/crawl/resume:
    $ref: ./paths/crawl.yaml#/resume
  /admin/queue:
    $ref: ./paths/queue.yaml#/admin_queue
  /admin/quota:
    $ref: ./paths/quota.yaml#/admin
  /downloads:
    $ref: ./paths/downloads.yaml#/create
components:
  schemas:
    AuthConfig:
      $ref: ./schemas/auth.yaml#/AuthConfig
    Error:
      $ref: ./schemas/common.yaml#/Error
    Health:
      $ref: ./schemas/common.yaml#/Health
    AuthRequest:
      $ref: ./schemas/auth.yaml#/AuthRequest
    User:
      $ref: ./schemas/auth.yaml#/User
    SharingSetting:
      $ref: ./schemas/sharing.yaml#/SharingSetting
    UpdateSharingRequest:
      $ref: ./schemas/sharing.yaml#/UpdateSharingRequest
    ApiKey:
      $ref: ./schemas/keys.yaml#/ApiKey
    CreateKeyRequest:
      $ref: ./schemas/keys.yaml#/CreateKeyRequest
    UpdateKeyRequest:
      $ref: ./schemas/keys.yaml#/UpdateKeyRequest
    ConnectFlickrAccountRequest:
      $ref: ./schemas/flickr_accounts.yaml#/ConnectFlickrAccountRequest
    ConnectFlickrAccountResponse:
      $ref: ./schemas/flickr_accounts.yaml#/ConnectFlickrAccountResponse
    FlickrAccount:
      $ref: ./schemas/flickr_accounts.yaml#/FlickrAccount
    AdminUser:
      $ref: ./schemas/admin_users.yaml#/AdminUser
    AdminUserPage:
      $ref: ./schemas/admin_users.yaml#/AdminUserPage
    UpdateAdminUserRequest:
      $ref: ./schemas/admin_users.yaml#/UpdateAdminUserRequest
    Plan:
      $ref: ./schemas/plans.yaml#/Plan
    UpdateAdminPlansRequest:
      $ref: ./schemas/plans.yaml#/UpdateAdminPlansRequest
    UpdateUserPlanRequest:
      $ref: ./schemas/plans.yaml#/UpdateUserPlanRequest
    CrawlQueue:
      $ref: ./schemas/queue.yaml#/CrawlQueue
    CrawlStatus:
      $ref: ./schemas/queue.yaml#/CrawlStatus
    StarContactRequest:
      $ref: ./schemas/queue.yaml#/StarContactRequest
    CrawlContactRequest:
      $ref: ./schemas/queue.yaml#/CrawlContactRequest
    AdminQueue:
      $ref: ./schemas/queue.yaml#/AdminQueue
    KeyQuota:
      $ref: ./schemas/quota.yaml#/KeyQuota
    AdminQuota:
      $ref: ./schemas/quota.yaml#/AdminQuota
    CreateDownloadRequest:
      $ref: ./schemas/downloads.yaml#/CreateDownloadRequest
    Download:
      $ref: ./schemas/downloads.yaml#/Download
