openapi: 3.1.0
info:
  title: XFlickr API
  version: 0.0.0
  description: HTTP API shared by the XFlickr backend and web client.
paths:
  /healthz:
    $ref: ./paths/common.yaml#/healthz
  /auth/register:
    $ref: ./paths/auth.yaml#/register
  /auth/login:
    $ref: ./paths/auth.yaml#/login
  /auth/logout:
    $ref: ./paths/auth.yaml#/logout
  /auth/sessions:
    $ref: ./paths/auth.yaml#/sessions
  /me:
    $ref: ./paths/auth.yaml#/me
  /keys:
    $ref: ./paths/keys.yaml#/collection
  /keys/{id}:
    $ref: ./paths/keys.yaml#/item
components:
  schemas:
    Error:
      $ref: ./schemas/common.yaml#/Error
    Health:
      $ref: ./schemas/common.yaml#/Health
    AuthRequest:
      $ref: ./schemas/auth.yaml#/AuthRequest
    User:
      $ref: ./schemas/auth.yaml#/User
    ApiKey:
      $ref: ./schemas/keys.yaml#/ApiKey
    CreateKeyRequest:
      $ref: ./schemas/keys.yaml#/CreateKeyRequest
    UpdateKeyRequest:
      $ref: ./schemas/keys.yaml#/UpdateKeyRequest
