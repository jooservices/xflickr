CrawlQueue:
  type: object
  required: [lanes]
  properties:
    lanes:
      type: array
      items: { $ref: '#/QueueLane' }

CrawlStatus:
  type: object
  additionalProperties: false
  required: [depths, facets, lanes]
  properties:
    depths:
      type: array
      items: { $ref: '#/DepthProgress' }
    facets:
      type: array
      items: { $ref: '#/FacetProgress' }
    lanes:
      type: array
      items: { $ref: '#/LaneStatus' }

DepthProgress:
  type: object
  required: [depth, contacts]
  properties:
    depth: { type: integer, minimum: 0 }
    contacts: { type: integer, format: int64, minimum: 0 }

FacetProgress:
  type: object
  required: [facet, total, done, active, failed]
  properties:
    facet: { type: string }
    total: { type: integer, format: int64, minimum: 0 }
    done: { type: integer, format: int64, minimum: 0 }
    active: { type: integer, format: int64, minimum: 0 }
    failed: { type: integer, format: int64, minimum: 0 }

LaneStatus:
  type: object
  required: [lane, pending, running, waiting, paused]
  properties:
    lane: { type: string, enum: [person, sizes] }
    pending: { type: integer, format: int64, minimum: 0 }
    running: { type: integer, format: int64, minimum: 0 }
    waiting: { type: integer, format: int64, minimum: 0 }
    paused: { type: integer, format: int64, minimum: 0 }

CrawlSettings:
  type: object
  additionalProperties: false
  description: The current user's crawl depth and the administrator limits.
  required: [depth, depth_default, depth_max]
  properties:
    depth: { type: integer, minimum: 1, description: Effective depth for this user. }
    depth_default: { type: integer, minimum: 1 }
    depth_max: { type: integer, minimum: 1 }

UpdateCrawlSettingsRequest:
  type: object
  additionalProperties: false
  required: [depth]
  properties:
    depth: { type: integer, minimum: 1 }

StarContactRequest:
  type: object
  additionalProperties: false
  required: [starred]
  properties:
    starred: { type: boolean }

CrawlContactRequest:
  type: object
  additionalProperties: false
  required: [nsid]
  properties:
    nsid: { type: string, minLength: 1, maxLength: 255 }

CrawlInterestStatus:
  type: string
  enum: [done, crawling, checking, queued, paused, error]

CrawlInterestRecentPhoto:
  type: object
  additionalProperties: false
  required: [id, thumbnail_url, alt]
  properties:
    id: { type: string }
    thumbnail_url: { type: [string, 'null'], format: uri }
    alt: { type: string }

CrawlInterest:
  type: object
  additionalProperties: false
  required: [nsid, name, username, avatar_url, depth, starred, status, photos_crawled, photos_total, favorites_count, sizes_percent, last_check_at, recent_photos]
  properties:
    nsid: { type: string }
    name: { type: string }
    username: { type: string }
    avatar_url: { type: [string, 'null'], format: uri }
    depth: { type: integer, minimum: 0 }
    starred: { type: boolean }
    status: { $ref: '#/CrawlInterestStatus' }
    photos_crawled: { type: integer, format: int64, minimum: 0 }
    photos_total: { type: integer, format: int64, minimum: 0 }
    favorites_count: { type: integer, format: int64, minimum: 0 }
    sizes_percent: { type: integer, minimum: 0, maximum: 100 }
    last_check_at: { type: [string, 'null'], format: date-time }
    recent_photos: { type: array, maxItems: 3, items: { $ref: '#/CrawlInterestRecentPhoto' } }

CrawlInterestCounts:
  type: object
  additionalProperties: false
  required: [all, starred, crawling, needs_attention]
  properties:
    all: { type: integer, format: int64, minimum: 0 }
    starred: { type: integer, format: int64, minimum: 0 }
    crawling: { type: integer, format: int64, minimum: 0 }
    needs_attention: { type: integer, format: int64, minimum: 0 }

CrawlInterestPage:
  type: object
  additionalProperties: false
  required: [items, counts, next_cursor, updated_at]
  properties:
    items: { type: array, items: { $ref: '#/CrawlInterest' } }
    counts: { $ref: '#/CrawlInterestCounts' }
    next_cursor: { type: [string, 'null'] }
    updated_at: { type: [string, 'null'], format: date-time }

SizesPriorityResponse:
  type: object
  additionalProperties: false
  required: [prioritised, next_cursor]
  properties:
    prioritised: { type: integer, format: int64, minimum: 0 }
    next_cursor: { type: [string, 'null'], maxLength: 1024 }

QueueLane:
  type: object
  required: [lane, backlog_calls, effective_calls_per_hour, eta_hours]
  properties:
    lane: { type: string, enum: [person, sizes] }
    backlog_calls: { type: integer, format: int64, minimum: 0 }
    effective_calls_per_hour: { type: number, format: double, minimum: 0 }
    eta_hours: { type: [number, 'null'], format: double, minimum: 0 }

AdminQueue:
  type: object
  required: [backlog_by_plan, oldest_item_age_seconds, ready_queue_sizes]
  properties:
    backlog_by_plan:
      type: array
      items: { $ref: '#/PlanLaneBacklog' }
    oldest_item_age_seconds: { type: integer, format: int64, minimum: 0 }
    ready_queue_sizes:
      type: array
      items: { $ref: '#/ReadyQueueSize' }

PlanLaneBacklog:
  type: object
  required: [plan, lane, backlog_calls]
  properties:
    plan: { type: string }
    lane: { type: string, enum: [person, sizes] }
    backlog_calls: { type: integer, format: int64, minimum: 0 }

ReadyQueueSize:
  type: object
  required: [queue, ready_jobs]
  properties:
    queue: { type: string }
    ready_jobs: { type: integer, format: int64, minimum: 0 }
