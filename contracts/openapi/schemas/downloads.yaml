CreateDownloadRequest:
  type: object
  additionalProperties: false
  properties:
    kind:
      type: string
      enum: [contact, album, tray]
    subject:
      type: string
      minLength: 1
    photo_ids:
      type: array
      items:
        type: integer
        format: int64
      minItems: 1
      maxItems: 500
  required: [kind]
Download:
  type: object
  properties:
    id: { type: integer, format: int64 }
    kind: { type: string, enum: [contact, album, tray] }
    subject: { type: string }
    status: { type: string }
    created_at: { type: string, format: date-time }
    expires_at: { type: string, format: date-time }
    item_count: { type: integer }
    skipped: { type: integer }
  required: [id, kind, subject, status, created_at, expires_at, item_count, skipped]
DownloadPartLink:
  type: object
  properties:
    part_number: { type: integer, minimum: 1 }
    url: { type: string, format: uri }
    bytes: { type: integer, format: int64, minimum: 0 }
    expires_at: { type: string, format: date-time }
  required: [part_number, url, bytes, expires_at]
DownloadPartLinks:
  type: object
  properties:
    download_id: { type: integer, format: int64 }
    parts:
      type: array
      items:
        $ref: '#/DownloadPartLink'
  required: [download_id, parts]
RetryFailedDownloadResponse:
  type: object
  properties:
    requeued: { type: integer, minimum: 0 }
  required: [requeued]
