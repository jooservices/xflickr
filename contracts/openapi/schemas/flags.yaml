FeatureFlag:
  type: object
  additionalProperties: false
  required: [name, enabled, audience, user_ids]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[a-z][a-z0-9_.-]{0,127}$'
    enabled: { type: boolean }
    audience:
      $ref: '#/FeatureFlagAudience'
    user_ids:
      type: array
      maxItems: 10000
      uniqueItems: true
      items: { type: integer, format: int64, minimum: 1 }
      description: Required for all audiences; must be empty unless audience is user_ids.
    links:
      readOnly: true
      $ref: ./rest.yaml#/Links
FeatureFlagAudience:
  type: string
  enum: [all, admins, user_ids]
RESTFeatureFlag:
  allOf:
    - $ref: '#/FeatureFlag'
    - type: object
      required: [links]
      properties:
        links: { $ref: ./rest.yaml#/Links }
RESTFeatureFlagEnvelope:
  type: object
  additionalProperties: false
  required: [success, code, message, data, meta, errors, trace_id]
  properties:
    success: { type: boolean, const: true }
    code: { type: integer, minimum: 200, maximum: 200 }
    message: { type: string }
    data: { $ref: '#/RESTFeatureFlag' }
    meta:
      type: object
      additionalProperties: true
    errors: { type: 'null' }
    trace_id: { type: string }
UpdateAdminFlagsRequest:
  type: object
  additionalProperties: false
  required: [flags]
  properties:
    flags:
      type: array
      minItems: 1
      items: { $ref: '#/FeatureFlag' }
