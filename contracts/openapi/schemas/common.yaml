Error:
  type: object
  additionalProperties: false
  description: Shared error body returned by the API.
  required:
    - code
    - message
  properties:
    code:
      type: string
      description: Stable machine-readable error code.
    message:
      type: string
      description: Human-readable explanation of the error.
    details:
      type: object
      additionalProperties: true
      description: Optional structured context for the error.
Health:
  type: object
  additionalProperties: false
  description: Process health reported by GET /healthz.
  required:
    - status
    - version
  properties:
    status:
      type: string
      description: Health status. Healthy processes report ok.
    version:
      type: string
      description: Build version of the running process.
