setting:
  get:
    operationId: GetMeSharing
    tags: [sharing]
    summary: Get the current user's sharing choice
    responses:
      '200':
        description: Persisted sharing setting and shared record count
        headers:
          Cache-Control: { schema: { type: string } }
        content:
          application/json:
            schema: { $ref: ../schemas/sharing.yaml#/SharingSummaryEnvelope }
      '401':
        description: Authentication required
        content:
          application/problem+json:
            schema: { $ref: ../schemas/rest.yaml#/RESTProblem }
      default:
        description: Problem response
        content:
          application/problem+json:
            schema: { $ref: ../schemas/rest.yaml#/RESTProblem }
  put:
    operationId: PutMeSharing
    tags: [sharing]
    summary: Replace the current user's sharing choice
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/sharing.yaml#/UpdateSharingRequest }
    responses:
      '200':
        description: Current sharing setting
        headers:
          Cache-Control: { schema: { type: string } }
        content:
          application/json:
            schema: { $ref: ../schemas/sharing.yaml#/SharingEnvelope }
      '400':
        description: Malformed request
        content:
          application/problem+json:
            schema: { $ref: ../schemas/rest.yaml#/RESTProblem }
      '401':
        description: Authentication required
        content:
          application/problem+json:
            schema: { $ref: ../schemas/rest.yaml#/RESTProblem }
      '403':
        description: CSRF token is missing or invalid
        content:
          application/problem+json:
            schema: { $ref: ../schemas/rest.yaml#/RESTProblem }
      '422':
        description: Invalid sharing choice
        content:
          application/problem+json:
            schema: { $ref: ../schemas/rest.yaml#/RESTProblem }
      default:
        description: Problem response
        content:
          application/problem+json:
            schema: { $ref: ../schemas/rest.yaml#/RESTProblem }
