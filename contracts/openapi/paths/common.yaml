healthz:
  get:
    operationId: getHealth
    tags:
      - common
    summary: Report process health.
    description: Returns the process status and build version.
    responses:
      "200":
        description: The process is healthy.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Health
      default:
        description: The process cannot report health.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
readyz:
  get:
    operationId: getReadiness
    tags:
      - common
    summary: Report dependency readiness.
    description: Returns the status of each required dependency for every selected role. Internal dependency errors are not exposed.
    responses:
      "200":
        description: Every selected role and required dependency is ready.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Readiness
      "503":
        description: One or more roles or required dependencies are not ready.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Readiness
