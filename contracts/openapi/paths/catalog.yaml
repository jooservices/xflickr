people:
  get:
    operationId: listPeople
    tags: [catalog]
    summary: List people visible to the signed-in user
    security: [{ SessionCookie: [] }]
    parameters:
      - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    responses:
      '200': { description: Visible people page, content: { application/json: { schema: { $ref: ../schemas/catalog.yaml#/CatalogPersonPage } } } }
      '400': { description: Invalid page request, content: { application/json: { schema: { $ref: ../schemas/common.yaml#/Error } } } }
      '401': { description: Authentication required, content: { application/json: { schema: { $ref: ../schemas/common.yaml#/Error } } } }
      '500': { description: Catalog could not be read, content: { application/json: { schema: { $ref: ../schemas/common.yaml#/Error } } } }

person:
  get:
    operationId: getPerson
    tags: [catalog]
    summary: Get a person visible to the signed-in user
    security: [{ SessionCookie: [] }]
    parameters:
      - { name: nsid, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    responses:
      '200': { description: Visible person, content: { application/json: { schema: { $ref: ../schemas/catalog.yaml#/CatalogPerson } } } }
      '401': { description: Authentication required, content: { application/json: { schema: { $ref: ../schemas/common.yaml#/Error } } } }
      '404': { description: Person is missing or not visible, content: { application/json: { schema: { $ref: ../schemas/common.yaml#/Error } } } }
      '500': { description: Catalog could not be read, content: { application/json: { schema: { $ref: ../schemas/common.yaml#/Error } } } }

