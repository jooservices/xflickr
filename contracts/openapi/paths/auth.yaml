config:
  get:
    operationId: GetAuthConfig
    summary: Get public authentication options
    responses:
      '200':
        description: Public authentication options
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/AuthConfig

register:
  post:
    operationId: Register
    summary: Register a user
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/RegisterRequest
    responses:
      '201':
        description: User created
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/User
      '400':
        description: Invalid request
      '409':
        description: Email already registered or registration closed

login:
  post:
    operationId: Login
    summary: Log in with email and password
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/AuthRequest
    responses:
      '200':
        description: Authenticated user
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/User
      '401':
        description: Invalid email or password
      '429':
        description: Too many login attempts

logout:
  post:
    operationId: Logout
    summary: Log out the current session
    responses:
      '204':
        description: Logged out

sessions:
  delete:
    operationId: RevokeOtherSessions
    summary: Revoke every session except the current one
    description: Deletes every server-side session for the authenticated user except the session presented by the xf_session cookie.
    responses:
      '204':
        description: Other sessions were revoked
      '401':
        description: Authentication required
      '403':
        description: CSRF token is missing or invalid

me:
  get:
    operationId: GetMe
    summary: Get the authenticated user
    responses:
      '200':
        description: Authenticated user
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/User
      '401':
        description: Authentication required
  patch:
    operationId: UpdateMe
    summary: Update the authenticated user's profile
    description: Updates the user's preferred language. Unsafe requests require a valid CSRF token.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/UpdateMeRequest
    responses:
      '200':
        description: Updated user profile
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/User
      '400':
        description: Invalid locale
      '401':
        description: Authentication required
      '403':
        description: CSRF token is missing or invalid
