config:
  get:
    operationId: GetAuthConfig
    summary: Get public authentication options
    responses:
      '200':
        description: Public authentication options
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/AuthConfig

register:
  post:
    operationId: Register
    summary: Register a user
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/RegisterRequest
    responses:
      '201':
        description: User created
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/User
      '400':
        description: Invalid registration fields
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/RegisterValidationError
      '409':
        description: Registration conflict
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/RegisterConflict

login:
  post:
    operationId: Login
    summary: Log in with email and password
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/AuthRequest
    responses:
      '200':
        description: Authenticated user
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/User
      '401':
        description: Invalid email or password
      '429':
        description: Too many login attempts
        headers:
          Retry-After:
            description: Seconds until another login attempt is allowed
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/LoginRateLimited
      '423':
        description: Account is temporarily locked
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/LoginLocked
      '403':
        description: Account is disabled

logout:
  post:
    operationId: Logout
    summary: Log out the current session
    responses:
      '204':
        description: Logged out

sessions:
  delete:
    operationId: RevokeOtherSessions
    summary: Revoke every session except the current one
    description: Deletes every server-side session for the authenticated user except the session presented by the xf_session cookie.
    responses:
      '204':
        description: Other sessions were revoked
      '401':
        description: Authentication required
      '403':
        description: CSRF token is missing or invalid

me:
  get:
    operationId: GetMe
    summary: Get the authenticated user
    responses:
      '200':
        description: Authenticated user
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/User
      '401':
        description: Authentication required
  patch:
    operationId: UpdateMe
    summary: Update the authenticated user's profile
    description: Updates the user's preferred language. Unsafe requests require a valid CSRF token.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/UpdateMeRequest
    responses:
      '200':
        description: Updated user profile
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/User
      '400':
        description: Invalid locale
      '401':
        description: Authentication required
      '403':
        description: CSRF token is missing or invalid

me/sessions:
  get:
    operationId: ListMySessions
    summary: List the current user's active sessions
    responses:
      '200':
        description: Active sessions
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/SessionList
      '401':
        description: Authentication required

me/sessions/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  delete:
    operationId: RevokeMySession
    summary: Revoke one of the current user's sessions
    responses:
      '204':
        description: Session revoked
      '401':
        description: Authentication required
      '403':
        description: CSRF token is missing or invalid
      '404':
        description: Session not found

me/password:
  post:
    operationId: ChangeMyPassword
    summary: Change the current user's password
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/ChangePasswordRequest
    responses:
      '204':
        description: Password changed and other sessions revoked
      '400':
        description: Invalid password or current password
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
      '401':
        description: Authentication required
      '403':
        description: CSRF token is missing or invalid
      '429':
        description: Password change attempts are rate limited
        headers:
          Retry-After:
            description: Seconds until another password change attempt is allowed
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/LoginRateLimited
