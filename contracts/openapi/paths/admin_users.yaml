collection:
  get:
    operationId: ListAdminUsers
    tags: [admin]
    summary: List users
    description: Administrators list users newest first, one page at a time. The optional q parameter keeps only users whose email contains the text, ignoring case.
    parameters:
      - name: q
        in: query
        required: false
        description: Case-insensitive text to find inside the email address
        schema:
          type: string
          maxLength: 254
      - name: page
        in: query
        required: false
        description: One-based page number
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        required: false
        description: Users per page
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
    responses:
      '200':
        description: One page of users
        content:
          application/json:
            schema:
              $ref: ../schemas/admin_users.yaml#/AdminUserPage
      '401':
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
      '403':
        description: Administrator role required
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
item:
  parameters:
    - name: id
      in: path
      required: true
      description: User id
      schema:
        type: integer
        format: int64
  patch:
    operationId: UpdateAdminUser
    tags: [admin]
    summary: Change a user's role or disabled state
    description: Sends only the fields to change. The last active administrator cannot be disabled or demoted and the call responds with 409 and code last_admin. Every change is recorded in the audit trail.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin_users.yaml#/UpdateAdminUserRequest
    responses:
      '200':
        description: The updated user
        content:
          application/json:
            schema:
              $ref: ../schemas/admin_users.yaml#/AdminUser
      '400':
        description: The request body is empty or invalid
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
      '401':
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
      '403':
        description: Administrator role required, or the CSRF token is missing or invalid
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
      '409':
        description: The change would leave no active administrator
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/Error
