    summary: List photos visible for one contact
    security: [{ SessionCookie: [] }]
    parameters:
      - { name: nsid, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
    responses:
      '200': { description: Contact photo page, content: { application/json: { schema: { $ref: ../schemas/catalog.yaml#/ContactPhotoPage } } }}
