contact:
  get:
    operationId: getMeContact
    tags: [catalog]
    summary: Get contact identity and user-scoped crawl progress
    security: [{ SessionCookie: [] }]
    parameters:
      - { name: nsid, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    responses:
      '200': { description: Contact visible to the signed-in user, content: { application/json: { schema: { $ref: ../schemas/catalog.yaml#/ContactDetail } } } }
      '401': { description: Authentication required, content: { application/json: { schema: { $ref: ../schemas/common.yaml#/Error } } }}
      '403': { description: Contact is forbidden, content: { application/json: { schema: { $ref: ../schemas/common.yaml#/Error } } }}
      '404': { description: Contact not found or not visible, content: { application/json: { schema: { $ref: ../schemas/common.yaml#/Error } } }}
      '500': { description: Contact could not be read, content: { application/json: { schema: { $ref: ../schemas/common.yaml#/Error } } }}

photos:
  get:
    operationId: listMeContactPhotos
