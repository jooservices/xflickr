pool_crawl:
  put:
    operationId: setMeContactGroupPoolCrawl
    tags: [catalog]
    summary: Change pool crawling preference for one group
    security: [{ SessionCookie: [] }]
    parameters:
      - { name: nsid, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      - { name: group_nsid, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/catalog.yaml#/ContactGroupPoolCrawlRequest }
    responses:
      '200': { description: Updated group preference, content: { application/json: { schema: { $ref: ../schemas/catalog.yaml#/ContactGroupPoolCrawlResponse } } }}
      '401': { description: Authentication required, content: { application/json: { schema: { $ref: ../schemas/common.yaml#/Error } } }}
      '404': { description: Contact or group not found, content: { application/json: { schema: { $ref: ../schemas/common.yaml#/Error } } }}
