<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>XFlickr POC - admin and user</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one shell, two worlds. USER = light gallery (top nav, wide search, edge-to-edge photo grids).
   ADMIN = dark control room (left rail, dense panels, live charts). Role switch swaps tokens + layout. */
:root{
  --bg:#f6f7fa; --surface:#ffffff; --sunken:#eef0f5; --raise:#e7eaf1; --line:#e2e5ec; --line2:#cfd4de;
  --ink:#161a22; --muted:#5d6574; --faint:#8a92a1;
  --accent:#2457d6; --accent-ink:#ffffff; --accent-soft:#e6edfd; --fav:#d93c74;
  --ok:#1d8a52; --warn:#a86500; --bad:#c9302c; --info:#5a52c9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --shade:rgba(18,22,30,.10); --overlay:#0c0e12;
  --f-disp:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:14px; --btn-r:999px; --row-h:190px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1116; --surface:#171a21; --sunken:#1e222b; --raise:#252a35; --line:#2a2f3a; --line2:#3a4150;
  --ink:#e8eaf0; --muted:#a0a7b4; --faint:#747c8a;
  --accent:#7d9cff; --accent-ink:#0d1220; --accent-soft:#1f2a47; --fav:#ff6f9f;
  --ok:#4fc887; --warn:#f0b04a; --bad:#ff7b72; --info:#a59ff2;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --shade:rgba(0,0,0,.4); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f1116; --surface:#171a21; --sunken:#1e222b; --raise:#252a35; --line:#2a2f3a; --line2:#3a4150;
  --ink:#e8eaf0; --muted:#a0a7b4; --faint:#747c8a;
  --accent:#7d9cff; --accent-ink:#0d1220; --accent-soft:#1f2a47; --fav:#ff6f9f;
  --ok:#4fc887; --warn:#f0b04a; --bad:#ff7b72; --info:#a59ff2;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --shade:rgba(0,0,0,.4); color-scheme:dark; }
/* Admin control room: dark first, light when asked */
:root[data-role="admin"]{
  --bg:#0b0f15; --surface:#11171f; --sunken:#161e28; --raise:#1c2632; --line:#222c3a; --line2:#2e3a4c;
  --ink:#d6dee8; --muted:#8190a4; --faint:#5d6b82;
  --accent:#4cb4d8; --accent-ink:#04131a; --accent-soft:#12303d; --fav:#ee5d98;
  --ok:#3cb87c; --warn:#e2ae3d; --bad:#ea5a4e; --info:#9590ee;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --shade:rgba(0,0,0,.45);
  --f-disp:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:9px; --btn-r:7px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root[data-role="admin"]:not([data-theme="dark"]){
  --bg:#eef1f5; --surface:#ffffff; --sunken:#f5f7fa; --raise:#e9edf3; --line:#dce2ea; --line2:#c9d2de;
  --ink:#16202c; --muted:#56657a; --faint:#7d8a9c;
  --accent:#0c7da3; --accent-ink:#ffffff; --accent-soft:#dcf0f7; --fav:#c7366f;
  --ok:#1c8752; --warn:#9c6a00; --bad:#c5372c; --info:#5a52c9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --shade:rgba(20,32,48,.14); color-scheme:light; } }
:root[data-role="admin"][data-theme="light"]{
  --bg:#eef1f5; --surface:#ffffff; --sunken:#f5f7fa; --raise:#e9edf3; --line:#dce2ea; --line2:#c9d2de;
  --ink:#16202c; --muted:#56657a; --faint:#7d8a9c;
  --accent:#0c7da3; --accent-ink:#ffffff; --accent-soft:#dcf0f7; --fav:#c7366f;
  --ok:#1c8752; --warn:#9c6a00; --bad:#c5372c; --info:#5a52c9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --shade:rgba(20,32,48,.14); color-scheme:light; }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
[data-role="admin"] body{font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
[data-role="admin"] :is(h1,h2,h3,h4){font-weight:600;letter-spacing:.01em}
h1{font-size:clamp(24px,3vw,32px);line-height:1.15}
h2{font-size:19px;line-height:1.25}
h3{font-size:15.5px;line-height:1.3}
[data-role="admin"] h1{font-size:1.55rem}
[data-role="admin"] .panel-h h2{font-size:.86rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.85em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.86em}
.eyebrow{font-family:var(--f-disp);font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-disp);font-weight:700;font-size:19px;border:0;background:none;cursor:pointer;padding:0;flex:none}
.brand-dots{display:flex;gap:3px}.brand-dots i{width:10px;height:10px;border-radius:50%;background:var(--accent)}.brand-dots i+i{background:var(--fav)}
.brand small{font:500 .66rem var(--f-mono);color:var(--faint);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line2);border-radius:4px;padding:0 5px}
.roleswitch{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:var(--btn-r);padding:3px;flex:none}
.roleswitch button{border:0;background:none;border-radius:var(--btn-r);padding:5px 13px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
.roleswitch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.searchbox{flex:1;max-width:640px;margin-inline:auto;display:flex;align-items:center;gap:10px;background:var(--sunken);border:1px solid transparent;border-radius:var(--btn-r);padding:0 6px 0 14px;height:42px}
.searchbox:focus-within{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;outline:none;height:100%}
.top-actions{display:flex;align-items:center;gap:2px;flex:none;margin-left:auto}
.icon-btn{width:36px;height:36px;border-radius:var(--btn-r);border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);position:relative;flex:none}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn .count{position:absolute;top:1px;right:0;min-width:16px;height:16px;border-radius:8px;background:var(--fav);color:#fff;font:700 10px/16px var(--f-body);text-align:center;padding:0 4px}
.txt-btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--btn-r);padding:4px 10px;font:600 12px var(--f-body);cursor:pointer;color:var(--muted);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.txt-btn:hover{color:var(--ink);border-color:var(--line2)}
.txt-btn.live-on .dotlive{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.tabs-row{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-row::-webkit-scrollbar{display:none}
.navtab{border:0;background:transparent;padding:9px 13px 11px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2.5px solid transparent;display:flex;align-items:center;gap:7px;font-size:14px}
.navtab:hover{color:var(--ink)}
.navtab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.navtab .count{font-size:11px;background:var(--fav);color:#fff;border-radius:9px;padding:0 6px;font-weight:700}
main{padding-block:22px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
[data-role="user"] main{max-width:1440px;margin:0 auto}
.admin-wrap{display:grid;grid-template-columns:226px minmax(0,1fr);min-height:calc(100vh - 56px)}
.rail{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));align-self:start;height:calc(100dvh - 56px - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:12px 10px 18px;padding-left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.nav-group{display:flex;flex-direction:column;gap:1px}
.nav-group .eyebrow{padding:4px 10px;font-size:.66rem;color:var(--faint)}
.nav-item{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;border:0;background:none;color:var(--muted);text-align:left;cursor:pointer;font-weight:500;width:100%}
.nav-item:hover{background:var(--sunken);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav-item[aria-current="page"] svg{color:var(--accent)}
.nav-item .badge{margin-left:auto}
.rail-foot{margin-top:auto;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:.8rem;display:flex;flex-direction:column;gap:6px}
.menu-btn{display:none}

/* ---------- building blocks ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-bottom:18px}
.page-head .sub{color:var(--muted);margin-top:4px;max-width:70ch;font-size:.94em}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}
.crumb{border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font-size:13px;display:inline-flex;gap:4px;align-items:center;margin-bottom:6px}
.crumb:hover{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
[data-role="admin"] .stack{gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
[data-role="admin"] .grid{gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.auto{grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-width:0;display:flex;flex-direction:column}
.panel-h{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.panel-b{padding:14px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);border-radius:var(--btn-r);padding:7px 14px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:14px}
[data-role="admin"] .btn{background:var(--sunken);font-weight:500;font-size:13.5px;padding:6px 12px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}.btn.ghost:hover{color:var(--ink);background:var(--sunken)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--btn-r);padding:4px 11px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
[data-role="admin"] .chip{border-radius:6px;background:var(--sunken);font-size:12.5px;padding:3px 9px}
[data-role="admin"] .chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted);background:var(--sunken)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.pill.info{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.pill.vio{color:var(--info);background:color-mix(in srgb,var(--info) 14%,transparent)}
[data-role="admin"] .pill{font:600 .7rem/1.7 var(--f-disp);letter-spacing:.05em;text-transform:uppercase;border-radius:5px}
.badge{display:inline-block;padding:0 6px;border-radius:5px;background:var(--raise);color:var(--muted);font:500 .72rem/1.6 var(--f-mono)}
.tag{display:inline-block;background:var(--sunken);border-radius:6px;padding:2px 8px;font-size:12.5px;border:0;color:var(--muted)}
button.tag{cursor:pointer}button.tag:hover{color:var(--accent)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 16px;font-size:.9em;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--raise);overflow:hidden;min-width:50px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .6s}
.bar.ok>i{background:var(--ok)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)} .bar.thin{height:4px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-weight:600;font-size:13px}
.field .help{font-size:12px;color:var(--muted)}
.input,select.input{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:8px 12px;width:100%;min-width:0}
[data-role="admin"] .input{border-radius:7px;background:var(--sunken);padding:6px 10px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.invalid{border-color:var(--bad)}
.err-text{color:var(--bad);font-size:13px}
.switch{position:relative;width:42px;height:24px;flex:none;border:0;border-radius:12px;background:var(--line2);cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.toggle-row:first-child{border-top:0}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;min-width:0}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{text-align:left;font:600 .7rem var(--f-disp);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--sunken)}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl .r{text-align:right}
.tbl td.wrap{white-space:normal;min-width:240px}
.tbl tr.fresh td{animation:fresh 1.6s ease-out}
@keyframes fresh{from{background:var(--accent-soft)}}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:var(--radius);padding:12px 14px;border:1px solid;font-size:.94em}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.banner.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 9%,transparent)}
.banner.info{border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.banner>svg{flex:none;margin-top:2px}
.banner.warn>svg{color:var(--warn)}.banner.bad>svg{color:var(--bad)}.banner.info>svg{color:var(--accent)}
.banner .btn{margin-left:auto}
.stats{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stat{flex:1 1 150px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font:700 1.5rem/1.15 var(--f-disp);font-variant-numeric:tabular-nums}
[data-role="admin"] .stat .v{font-weight:600}
.stat .v small{font-size:.85rem;color:var(--muted);font-weight:500}
.stat .d{font-size:.8rem;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:56px 16px;color:var(--muted)}
.empty .art{width:72px;height:72px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;color:var(--faint)}
.empty h3{color:var(--ink)}
.skel{background:linear-gradient(90deg,var(--sunken) 0%,var(--raise) 50%,var(--sunken) 100%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:8px}
@keyframes shimmer{to{background-position:-200% 0}}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:rot .8s linear infinite;display:inline-block;flex:none}
@keyframes rot{to{transform:rotate(1turn)}}
.sev{border-left:3px solid var(--faint)}.sev.crit,.sev.bad{border-left-color:var(--bad)}.sev.warn{border-left-color:var(--warn)}.sev.info{border-left-color:var(--accent)}.sev.ok{border-left-color:var(--ok)}
.list-item{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:.93em;align-items:flex-start}
.list-item:first-child{border-top:0}
.list-item .grow{flex:1;min-width:0}
.ic-dot{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--muted)}
.ic-dot.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.ic-dot.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}

/* =========================================================================

const $ = (s, el = document) => el.querySelector(s);

  if (els.includes('stars')) for (let i = 0; i < 40; i++) body += `<circle cx="${r() * W}" cy="${r() * hz}" r="${0.6 + r() * 1.2}" fill="#fff" opacity="${0.4 + r() * 0.6}"/>`;
  if (els.includes('moon')) { const mx = W * (0.6 + r() * 0.25); body += `<circle cx="${mx}" cy="${H * 0.25}" r="22" fill="#f6f1d3"/><circle cx="${mx + 10}" cy="${H * 0.22}" r="20" fill="${sc.sky[0]}"/>`; }
  if (els.includes('sun')) body += `<circle cx="${W * (0.3 + r() * 0.4)}" cy="${hz - 10}" r="${34 + r() * 14}" fill="#ffe3a1" opacity=".9"/>`;
  if (els.includes('mountain')) { const px = W * (0.35 + r() * 0.3); body += `<path d="M${px - 220} ${hz + 10} L${px} ${H * 0.18} L${px + 240} ${hz + 10}Z" fill="#7d8ea8"/><path d="M${px - 42} ${H * 0.18 + 52} L${px} ${H * 0.18} L${px + 46} ${H * 0.18 + 56} L${px + 14} ${H * 0.18 + 44} L${px - 6} ${H * 0.18 + 60}Z" fill="#fff"/>`; }
  if (els.includes('city')) { let x = -10; while (x < W) { const bw = 26 + r() * 40, bh = 60 + r() * 140; body += `<rect x="${x}" y="${hz - bh}" width="${bw}" height="${bh + 20}" fill="#3e4658"/>`; for (let wy = hz - bh + 10; wy < hz - 8; wy += 14) for (let wx = x + 6; wx < x + bw - 6; wx += 10) if (r() > .45) body += `<rect x="${wx}" y="${wy}" width="4" height="6" fill="#ffd77a" opacity=".85"/>`; x += bw + 3; } }
  body += `<path d="M0 ${hz} Q ${W * 0.3} ${hz - 22 - r() * 20} ${W * 0.6} ${hz} T ${W} ${hz - 8} V ${H} H 0Z" fill="${sc.ground}"/>`;
  if (els.includes('sea')) body += `<rect x="0" y="${hz - 30}" width="${W}" height="34" fill="#3d8fc4" opacity=".85"/><rect x="0" y="${hz - 6}" width="${W}" height="3" fill="#fff" opacity=".6"/>`;
  if (els.includes('lake')) body += `<ellipse cx="${W / 2}" cy="${hz + 40}" rx="${W * 0.45}" ry="28" fill="#6fb6c8" opacity=".9"/>`;
  if (els.includes('tree')) { const n = 3 + Math.floor(r() * 5); for (let i = 0; i < n; i++) { const tx = r() * W, th = 50 + r() * 80, ty = hz + 6 + r() * 12; const col = sc.ground === '#3b2c3d' ? '#2a1f2c' : ['#2e6b34', '#3d7f3f', '#24552b'][i % 3]; body += `<rect x="${tx - 3}" y="${ty - 12}" width="6" height="16" fill="#5a3d2b"/><path d="M${tx - th * 0.28} ${ty - 8} L${tx} ${ty - th} L${tx + th * 0.28} ${ty - 8}Z" fill="${col}"/>`; } }
  if (els.includes('person')) { const px = W * (0.35 + r() * 0.3), py = hz + 40; body += `<circle cx="${px}" cy="${py - 58}" r="10" fill="#3a2a24"/><rect x="${px - 11}" y="${py - 47}" width="22" height="34" rx="8" fill="${['#c8553d', '#2d5d8c', '#e0a43a'][Math.floor(r() * 3)]}"/><rect x="${px - 9}" y="${py - 15}" width="7" height="26" fill="#2b2f3a"/><rect x="${px + 2}" y="${py - 15}" width="7" height="26" fill="#2b2f3a"/>`; }
  if (els.includes('dog')) { const dx = W * (0.55 + r() * 0.25), dy = hz + 52; body += `<ellipse cx="${dx}" cy="${dy - 14}" rx="22" ry="11" fill="#8a5a33"/><circle cx="${dx + 22}" cy="${dy - 24}" r="9" fill="#8a5a33"/><path d="M${dx + 25} ${dy - 31} l6 -8 l2 10z" fill="#6b4426"/><rect x="${dx - 16}" y="${dy - 6}" width="4" height="12" fill="#6b4426"/><rect x="${dx + 10}" y="${dy - 6}" width="4" height="12" fill="#6b4426"/><path d="M${dx - 21} ${dy - 18} q-10 -8 -8 -16" stroke="#8a5a33" stroke-width="4" fill="none"/>`; }

        if (d.user === ME.id) NOTIFS.unshift({ ic: 'download', tone: 'ok', text: `ZIP for <b>${esc(d.source)}</b> is ready. Link expires in ${DEFAULTS.zipTtl} h.`, t: now, unread: true });

    const limit = d && d.state === 'running' ? d.done : u.total;

    else u.speed = 0;
    const node = d ? d.node : 'crawl-sg-1';

    if (u.done >= u.total) {
      u.state = 'done'; u.took = (now - u.started) / 1000; u.speed = 0;

  });
  // --- crawl jobs and lanes

    if (j.state === 'retry' && now >= j.nextRetry) { j.state = 'running'; j.attempt++; j.started = now; evAdd('info', 'crawl', `${j.id} retry ${j.attempt}/${j.max}: ${j.method} for ${CMAP[j.contact].name}.`); }
    if (j.state !== 'running') return;
    const k = KMAP[j.key];

        j.attempts.push({ n: j.attempt, t: now, res: j.err, ms: ri(900, 10000) });

      else { j.done = 1; j.records = ri(60, 100); }
      if ((j.lane === 'sizes' && j.done >= j.batch) || (j.lane === 'person' && rnd() < .5)) {
        j.state = 'done'; j.took = now - j.started; j.attempts.push({ n: j.attempt, t: now, res: '200 OK', ms: ri(120, 780) }); j.finished = now;

  LANES.sizes.inflight = JOBS.filter(j => j.lane === 'sizes' && j.state === 'running').length;

  M.err[last(M.err)] = recent.length ? recent.filter(l => l.status !== 200).length / recent.length * 100 : 0;

    else if (r < .5) evAdd('info', 'crawl', `Change check: ${c.name} has ${ri(1, 9)} new photos.`);
    else if (r < .65) evAdd('info', 'crawl', `Skipped ${ri(20, 240)} calls: records already shared by another user.`);
    else if (r < .8) evAdd('info', 'ai', `Captioned ${ri(10, 40)} photos. Caption queue ${fmt(AI.capQueue)}.`);
    else if (r < .9) evAdd('info', 'cluster', `Heartbeat round: ${NODES.filter(n => n.health === 'ok').length} of ${NODES.length} nodes healthy.`);

// advance a download or upload: N parallel streams, checksum verify, up to 3 tries per file
function stepFiles(job, conc, [lo, hi], isUp = false) {
  let speed = 0;
  job.files.forEach(f => {
    if (f.st === 'verifying') {
      if (rnd() < .012) { f.tries++; if (f.tries > 3) { f.st = 'failed'; job.done++; job.failed++; } else { f.st = 'retrying'; f.p = 0; if (isUp) job.retries++; } }
      else { f.st = 'ok'; f.ck = hex(8); job.done++; }
    } else if (f.st === 'retrying') f.st = 'active';
  });
  let active = job.files.filter(f => f.st === 'active');
  for (const f of job.files) { if (active.length >= conc) break; if (f.st === 'pending') { f.st = 'active'; f.p = 0; f.ms = 0; active.push(f); } }
  active.forEach(f => {
    f.sp = lo + rnd() * (hi - lo); speed += f.sp;
    const step = Math.min(f.size * (1 - f.p / 100), f.sp);
    f.p = Math.min(100, f.p + f.sp / f.size * 100); f.ms += 1000; job.bytesDone += step;
    if (f.p >= 100) { f.st = 'verifying'; f.ms = Math.round(f.ms * (.6 + rnd() * .4)); }
  });
  job.speed = speed;
}

function libPhotos() {
  const L = S.lib;
  let ps = PHOTOS.filter(p => {
    if (L.contacts.size && !L.contacts.has(p.owner)) return false;
    if (L.sizes && !p.sizesReady) return false;
    if (L.captioned && !p.captioned) return false;
    if (L.kind === 'favorites') return p.favBy.length > 0;
    if (L.kind === 'galleries') return p.galleries.length > 0;
    if (L.kind === 'albums') return p.albums.length > 0;
    return true;
  });
  if (L.sort === 'new') ps.sort((a, b) => b.taken.localeCompare(a.taken)); else if (L.sort === 'views') ps.sort((a, b) => b.views - a.views); else ps.sort((a, b) => b.faves - a.faves);
  return ps;
}

// natural-language search: concept words in EN/VI map to what the captioner and tags saw
const CONCEPTS = {
  tree: ['tree', 'trees', 'cây', 'cay', 'forest', 'rừng', 'pine'], person: ['person', 'people', 'man', 'woman', 'người', 'nguoi', 'portrait', 'chân dung'], dog: ['dog', 'dogs', 'chó', 'cho', 'puppy', 'cún'],
  sea: ['sea', 'ocean', 'beach', 'biển', 'bien', 'bãi biển', 'waves'], mountain: ['mountain', 'mountains', 'núi', 'nui', 'peak', 'snow', 'tuyết'], sun: ['sunset', 'sun', 'hoàng hôn', 'golden'],
  stars: ['star', 'stars', 'night', 'đêm', 'sao', 'moon', 'trăng', 'night sky'], city: ['city', 'street', 'buildings', 'thành phố', 'phố', 'skyline'], lake: ['lake', 'hồ', 'reflection', 'water', 'nước'],
};
const CONCEPT_LABEL = { tree: 'trees', person: 'person', dog: 'dog', sea: 'sea / beach', mountain: 'mountain', sun: 'sunset', stars: 'night sky', city: 'city', lake: 'lake' };
function parseQuery(q) {
  const s = ' ' + q.toLowerCase() + ' ', found = [];
  Object.entries(CONCEPTS).forEach(([k, words]) => { if (words.some(w => s.includes(' ' + w + ' ') || s.includes(' ' + w + ',') || s.includes(w + 's '))) found.push(k); });
  const year = (q.match(/\b(20[12]\d)\b/) || [])[1];
  const contact = CONTACTS.find(c => s.includes(c.name.toLowerCase().split(' ')[0].toLowerCase() + ' '));
  return { found, year, contact, vi: /[ăâđêôơưạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ]/i.test(q) };
}
function searchResults(q) {
  const P = parseQuery(q), words = q.toLowerCase().split(/[\s,]+/).filter(w => w.length > 2);
  return PHOTOS.map(p => {
    const els = SCENES[p.scene].els.map(e => e === 'moon' ? 'stars' : e);
    const hit = P.found.filter(f => els.includes(f) || (f === 'sea' && p.scene === 'beach') || (f === 'mountain' && p.scene === 'mountain'));
    const vec = P.found.length ? hit.length / P.found.length * (p.captioned ? 1 : .7) : 0;
    const text = (p.title + ' ' + p.tags.join(' ')).toLowerCase();
    const bmHits = words.filter(w => text.includes(w));
    const bm = words.length ? bmHits.length / words.length : 0;
    let score = vec * .65 + bm * .35;
    if (P.year && String(p.year) !== P.year) score *= .3;
    if (P.contact && p.owner !== P.contact.id) score *= .3;
    return { p, score, vec, bm, hit, bmHits };
  }).filter(r => r.score > .2).sort((a, b) => b.score - a.score).slice(0, 40);
}
function vSearch() {
  const q = S.q.trim(), P = q ? parseQuery(q) : null, res = q ? searchResults(q) : [];
  LISTS.search = res.map(r => r.p.id);
  return pageHead(t('Search'), 'Hybrid search: keywords (BM25 on title, tags, description) plus meaning (bge-m3 vectors on the AI caption and metadata), merged by rank. Runs locally, works in Vietnamese and English.') +
    `<form class="search-big" data-form="search" style="margin-bottom:12px"><span class="muted">${icon('search', 20)}</span><input id="search-q" name="q" value="${esc(q)}" placeholder="a photo with trees, a person and a dog" aria-label="Search photos"><button class="btn primary">${t('Search')}</button></form>
    <div class="row" style="gap:6px;margin-bottom:18px">${EXAMPLES.map(e => `<button class="chip" aria-pressed="${e === q}" data-act="do-search" data-arg="${esc(e)}">${esc(e)}</button>`).join('')}</div>
    ${!q ? emptyBlock('sparkle', 'Describe what you remember', 'Try “a photo with trees, a person and a dog” or “ảnh có cây, người và chó”. Photos without an AI caption yet are still found through their title and tags.') : `
    <div class="card" style="margin-bottom:18px;padding:14px 16px"><div class="row" style="gap:8px"><span class="eyebrow">Understood as</span>
      ${P.found.length ? P.found.map(f => `<span class="pill info">${CONCEPT_LABEL[f]}</span>`).join('') : '<span class="muted small">no visual concepts, keyword match only</span>'}
      ${P.year ? `<span class="pill vio">year ${P.year}</span>` : ''}${P.contact ? `<span class="pill vio">from ${esc(P.contact.name)}</span>` : ''}
      ${P.vi ? '<span class="pill">Vietnamese query · same multilingual vectors</span>' : ''}<span style="flex:1"></span><span class="small muted num">${res.length} results · ${ri(38, 95)} ms</span></div>
      <div class="legend" style="margin-top:8px"><span><i style="background:var(--s1)"></i>Meaning (vector)</span><span><i style="background:var(--s2)"></i>Keywords (BM25)</span></div></div>
    ${res.length ? `<div class="result-list">${res.map(r => `<div class="result"><div class="thumb" role="button" tabindex="0" data-act="open-photo" data-arg="${r.p.id}" data-list="search"><img src="${photoSVG(r.p)}" alt="${esc(r.p.title)}"><span class="rel">${Math.round(r.score * 100)}</span></div>
      <div class="row between" style="gap:6px"><b style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.p.title)}</b><span class="small muted">${esc(CMAP[r.p.owner].name)}</span></div>
      <div class="score-split" title="Meaning ${Math.round(r.vec * 100)} · Keywords ${Math.round(r.bm * 100)}"><i style="flex:${r.vec * .65 + .001}"></i><i style="flex:${r.bm * .35 + .001}"></i></div>
      <div class="why">${r.hit.map(h => `<span>sees ${CONCEPT_LABEL[h]}</span>`).join('')}${r.bmHits.slice(0, 2).map(w => `<span>“${esc(w)}” in tags</span>`).join('')}${r.p.captioned ? '' : '<span>metadata only, caption queued</span>'}</div></div>`).join('')}</div>` : emptyBlock('search', 'No photos match yet', 'Nothing in your contacts matches this description. Try fewer words, or wait for more photos to be captioned.')}`}`;
}

function dlRow(d, admin) {
  const now = Date.now(), p = pct(d.done, d.total);
  let right = '';
  if (d.state === 'ready' || d.state === 'partial') right = `<div class="row" style="gap:6px"><span class="ttl muted">Link expires in ${hms(d.expires - now)}</span><button class="btn sm primary" data-act="copy" data-arg="https://xflickr.local/dl/${d.id}/${d.zip}">${icon('copy', 14)} ${t('Copy link')}</button></div>`;
  else if (d.state === 'running') right = `<span class="num small">${fmt1(d.speed)} MB/s · ${mb(d.bytesDone)} of ~${mb(d.bytes)}</span>`;
  else if (d.state === 'expired') right = `<button class="btn sm" data-act="redo-dl" data-arg="${d.id}">${icon('refresh', 14)} Prepare again</button>`;
  else if (d.state === 'queued') right = '<span class="small muted">Waits for your other download</span>';
  else if (d.state === 'syncing' || d.state === 'synced') right = `<span class="small muted">${d.state === 'synced' ? 'Uploaded to ' + d.dest + ', temp files deleted' : 'Uploading to ' + d.dest}</span>`;
  return `<div class="card stack" style="gap:10px"><div class="row between"><div style="min-width:0"><b>${esc(d.source)}</b><div class="small muted">${d.id} · ${d.scope} · ${d.size} · to ${d.dest}${admin ? ' · ' + esc(UMAP[d.user].name) : ''}</div></div>${pill(d.state)}</div>
    ${bar(p, d.failed ? 'warn' : d.state === 'ready' || d.state === 'synced' ? 'ok' : '')}
    <div class="row between small"><span class="num">${fmt(d.done)} / ${fmt(d.total)} files · ${fmt(d.done - d.failed)} checksum OK${d.failed ? ` · <span style="color:var(--bad)">${d.failed} failed</span>` : ''}${d.took ? ' · took ' + dur(d.took) : ''}</span>${right}</div></div>`;
}

const fileRow = f => `<tr><td class="mono">${f.n}</td><td class="r">${fmt1(f.size)} MB</td><td>${bar(f.p, f.st === 'failed' ? 'bad' : f.st === 'ok' ? 'ok' : '')}</td><td class="r">${f.st === 'active' ? fmt1(f.sp) + ' MB/s' : '—'}</td><td class="mono">${f.ck ? 'md5 ' + f.ck + '…' : '—'}</td><td class="r">${f.tries}</td><td class="r">${f.ms ? fmt(f.ms) + ' ms' : '—'}</td><td>${pill(f.st)}</td></tr>`;
function fileList(job) {
  const act = job.files.filter(f => ['active', 'verifying', 'retrying'].includes(f.st)), failed = job.files.filter(f => f.st === 'failed'), okd = job.files.filter(f => f.st === 'ok').slice(-8).reverse(), pend = job.files.filter(f => f.st === 'pending').slice(0, 4);
  return table(['File', '>Size', 'Progress', '>Speed', 'Checksum', '>Tries', '>Time', 'State'], [...act, ...failed, ...okd, ...pend].map(fileRow), 'ftable') + `<p class="small muted" style="padding:8px 12px">Showing active, failed, last 8 done and next 4 of ${fmt(job.total)} files.</p>`;
}

function previewWrap(html) {
  const r = S.role === 'user' ? S.u.route : S.a.route;
  if (S.preview === 'normal' || r === 'onboard') return html;
  const head = pageHead(routeTitle());
  const skel = S.role === 'user'
    ? `<div class="jgrid">${[1.5, .75, 1.33, 1, 1.5, .67, 1.78, 1.5, 1, 1.33, .75, 1.5].map(x => `<div class="jitem skel" style="--r:${x};cursor:default"><i></i></div>`).join('')}</div>`
    : `<div class="stack"><div class="stats">${hist(5, () => `<div class="stat"><div class="skel" style="height:12px;width:60%"></div><div class="skel" style="height:26px;width:40%;margin-top:6px"></div></div>`).join('')}</div><div class="panel">${hist(7, () => `<div class="list-item"><div class="skel" style="height:14px;flex:1"></div><div class="skel" style="height:14px;width:20%"></div></div>`).join('')}</div></div>`;

  return `<nav class="rail ${S.railOpen ? 'open' : ''}" aria-label="Admin sections">${A_NAV.map(([g, items]) => `<div class="nav-group"><span class="eyebrow">${t(g)}</span>${items.map(([r, l, ic]) => `<button class="nav-item" data-go="${r}" ${S.a.route === r || (S.a.route === 'node' && r === 'nodes') ? 'aria-current="page"' : ''}>${icon(ic, 16)} ${t(l)}${r === 'issues' ? live('rail-iss', () => `<span class="badge">${openIssues().length}</span>`) : ''}</button>`).join('')}</div>`).join('')}
    ${live('rail-foot', () => `<div class="rail-foot"><div class="row between"><span class="eyebrow">Cluster</span>${pill(NODES.every(n => n.health === 'ok') ? 'ok' : 'warn', NODES.every(n => n.health === 'ok') ? 'Healthy' : 'Degraded')}</div><span class="num">${clusterCalls()} calls/s · ${NODES.filter(n => n.health === 'ok').length}/${NODES.length} nodes</span>${spark(hist(60, i => KEYS.reduce((a, k) => a + (k.burstHist[i] || 0), 0)), 'var(--s1)', 20)}</div>`)}</nav>`;
}
function overlays() {
  let h = '';

    const d = S.drawer, title = d.type === 'job' ? 'Crawl job' : d.type === 'dl' ? 'Download job' : 'Upload process';

    h += `<div class="scrim" data-act="close-overlay" style="background:rgba(6,9,14,.3)"></div><aside class="drawer" role="dialog" aria-label="${title}"><div class="drawer-h"><h2>${title}</h2><span style="flex:1"></span><button class="icon-btn" data-act="close-overlay" aria-label="Close">${icon('x')}</button></div>${body}</aside>`;
  }

  return h;
}
function render() {
  LIVE = {};
  const root = document.documentElement;
  root.dataset.role = S.role;
  if (S.theme) root.dataset.theme = S.theme;
  document.documentElement.lang = S.lang;
  if (S.role === 'user') {
    const v = U_VIEWS[S.u.route] || vHome;
    $('#app').innerHTML = topbar() + `<main id="main">${previewWrap(v(S.u.param))}</main>`;
  } else {
    const v = A_VIEWS[S.a.route] || vOverview;
    $('#app').innerHTML = topbar() + `<div class="admin-wrap">${rail()}<main id="main">${previewWrap(v(S.a.param))}</main></div>${S.railOpen ? '<div class="scrim" data-act="rail" style="z-index:95;background:rgba(6,9,14,.35)"></div>' : ''}`;
  }
  $('#overlay').innerHTML = overlays();
  document.body.style.overflow = S.lightbox || S.modal ? 'hidden' : '';
}
function go(route, param = null) {
  const R = S.role === 'user' ? S.u : S.a;
  if (S.role === 'user' && !U_VIEWS[route]) { S.role = 'admin'; return go(route, param); }
  if (S.role === 'admin' && !A_VIEWS[route]) { S.role = 'user'; return go(route, param); }
  R.route = route; R.param = param;
  S.railOpen = false; S.notifOpen = false; S.lightbox = null; S.drawer = null;
  if (route === 'contact') S.cTab = 'photos';
  if (route === 'adl' && param) { S.drawer = { type: 'dl', id: param }; R.param = null; }
  try { history.replaceState(null, '', '#' + (S.role === 'user' ? 'u-' : 'a-') + route); } catch (e) { }
  render(); scrollTo(0, 0);
}

// ===== modals =====
function modal() {
  const m = S.modal, wrap = (title, body, foot) => `<div class="scrim" data-act="mclose-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h2>${title}</h2><span style="flex:1"></span><button class="icon-btn" data-act="mclose" aria-label="Close">${icon('x')}</button></div>${body}${foot}</div></div>`;
  if (m.type === 'add-key') return wrap('Add API key', `<form data-form="add-key" id="f-add-key"><div class="modal-b"><div class="field"><label for="ak-l">Label</label><input id="ak-l" name="l" class="input" value="${esc(m.l || 'Third key')}"></div>
    <div class="field"><label for="ak-k">API key</label><input id="ak-k" name="k" class="input mono ${m.err ? 'invalid' : ''}" value="${esc(m.k || '')}" placeholder="32 hex characters" autocomplete="off"></div><div class="field"><label for="ak-s">Secret</label><input id="ak-s" name="s" class="input mono" value="${esc(m.s || '')}" placeholder="16 hex characters" autocomplete="off"></div>
    ${m.err ? `<span class="err-text">${m.err}</span>` : ''}<p class="small muted">XFlickr checks the key with one flickr.test.echo call and places it on the least loaded healthy node.</p></div></form>`,
    `<div class="modal-f"><button class="btn ghost" data-act="ak-fill">Fill example</button><button class="btn" data-act="mclose">${t('Cancel')}</button><button class="btn primary" type="submit" form="f-add-key">Add key</button></div>`);
  if (m.type === 'move-key') { const k = KMAP[m.id]; return wrap(`Move ${k.id}`, `<form data-form="move-key" id="f-move"><div class="modal-b"><p class="small muted">${esc(k.label)} (${esc(UMAP[k.user].name)}) calls Flickr from ${k.node}. Moving it sends its next call from the new node’s IP.</p>
    <div class="field"><label for="mk-n">Target node</label><select id="mk-n" name="n" class="input">${NODES.filter(n => n.role !== 'Control' && n.health === 'ok' && n.id !== k.node).map(n => `<option value="${n.id}">${n.id} · ${n.region} · ${keysOn(n.id).length} keys</option>`).join('')}</select></div></div></form>`,
    `<div class="modal-f"><button class="btn" data-act="mclose">${t('Cancel')}</button><button class="btn primary" type="submit" form="f-move">Move key</button></div>`); }
  if (m.type === 'dl') {
    const ps = m.scope === 'contact' ? photosOf(+m.src) : m.scope === 'album' ? (ALBUMS.find(a => a.id === +m.src)?.photos || []).map(i => PH[i]) : [...S.tray].map(i => PH[i]);

    const dests = ['ZIP link', ...PROVIDERS.filter(p => MY_PROVIDERS[p.id] === 'connected').map(p => p.name)];
    return wrap('New download', `<form data-form="new-dl" id="f-dl"><div class="modal-b">
      ${m.scope !== 'tray' ? `<div class="grid g2"><div class="field"><label for="nd-scope">What</label><select id="nd-scope" class="input" data-chg="nd-scope"><option value="contact" ${m.scope === 'contact' ? 'selected' : ''}>All photos of a contact</option><option value="album" ${m.scope === 'album' ? 'selected' : ''}>One album</option></select></div>
        <div class="field"><label for="nd-src">${m.scope === 'contact' ? 'Contact' : 'Album'}</label><select id="nd-src" class="input" data-chg="nd-src">${m.scope === 'contact' ? CONTACTS.map(c => `<option value="${c.id}" ${+m.src === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('') : ALBUMS.map(a => `<option value="${a.id}" ${+m.src === a.id ? 'selected' : ''}>${esc(a.title)} · ${esc(CMAP[a.owner].name)}</option>`).join('')}</select></div></div>` : `<p>${S.tray.size} photos from your tray.</p>`}
      <div class="field"><span class="lbl">Size</span><div class="row" style="gap:6px">${['Original', 'Large 2048', 'Large 1600', 'Large 1024', 'Medium 800'].map(s => `<button type="button" class="chip" aria-pressed="${m.size === s}" data-act="nd-size" data-arg="${s}">${s}</button>`).join('')}</div></div>
      <div class="field"><label for="nd-dest">Deliver to</label><select id="nd-dest" class="input" data-chg="nd-dest">${dests.map(d => `<option ${m.dest === d ? 'selected' : ''}>${d}</option>`).join('')}</select><span class="help">${m.dest === 'ZIP link' ? `A private link valid ${DEFAULTS.zipTtl} h. Files are deleted after that.` : 'Uploaded as files finish. Temp files are deleted after the upload.'}</span></div>
      <div class="card" style="padding:12px 14px;background:var(--sunken);border:0"><dl class="kv"><dt>Files</dt><dd class="num">${fmt(total)}</dd><dt>Estimated size</dt><dd class="num">${mb(total * avgMB)}</dd><dt>API calls</dt><dd>${missing ? `${fmt(missing)} getSizes calls first (sizes not fetched yet), from your reserve-safe sizes lane` : '0, all sizes are already stored'}</dd></dl></div></div></form>`,
      `<div class="modal-f"><button class="btn" data-act="mclose">${t('Cancel')}</button><button class="btn primary" type="submit" form="f-dl">${icon('download', 16)} Start download</button></div>`);

  ack: id => { const i = ISSUES.find(x => x.id === id); i.state = 'acked'; i.by = 'Viet Vu'; evAdd('info', 'audit', `Viet Vu acknowledged: ${i.title}.`); render(); },
  resolve: id => { const i = ISSUES.find(x => x.id === id); i.state = 'resolved'; evAdd('info', 'audit', `Viet Vu resolved: ${i.title}.`); render(); },

  'nd-src': el => { S.modal.src = el.value; render(); },
  'nd-dest': el => { S.modal.dest = el.value; render(); },
};
const INP = { 'ev-q': el => { S.ev.q = el.value; refreshLive(); } };
const FORM = {
  search: fd => { S.q = (fd.get('q') || '').trim(); go('search'); },
  'ob-key': fd => {
    const k = (fd.get('k') || '').trim(), s = (fd.get('s') || '').trim(); S.ob.key = k; S.ob.secret = s;
    S.ob.keyErr = !/^[0-9a-f]{32}$/i.test(k) ? 'The key should be 32 characters, 0-9 and a-f. Copy it again from Flickr’s app page.' : !/^[0-9a-f]{16}$/i.test(s) ? 'The secret should be 16 characters, 0-9 and a-f.' : '';
    if (!S.ob.keyErr) S.ob.step = 1; render();
  },
  'add-key': fd => {
    const k = (fd.get('k') || '').trim(), s = (fd.get('s') || '').trim(), l = (fd.get('l') || 'New key').trim();
    Object.assign(S.modal, { k, s, l, err: !/^[0-9a-f]{32}$/i.test(k) ? 'The key should be 32 characters, 0-9 and a-f.' : !/^[0-9a-f]{16}$/i.test(s) ? 'The secret should be 16 characters, 0-9 and a-f.' : '' });
    if (S.modal.err) return render();
    const node = NODES.filter(n => n.role !== 'Control' && n.health === 'ok' && !n.drain).sort((a, b) => keysOn(a.id).length - keysOn(b.id).length)[0];
    const key = mkKey('k' + (KEYS.length + 1), ME.id, l, node.id, 0, 3600); key.hourly = hist(23, () => 0); KEYS.push(key); KMAP[key.id] = key; UMAP.u1.keys.push(key.id);
    evAdd('ok', 'audit', `Viet Vu added ${l} (${key.id}). Placed on ${node.id}.`); S.modal = null; render(); toast(`Key checked and placed on ${node.id}`);
  },
  'move-key': fd => { const k = KMAP[S.modal.id], from = k.node, to = fd.get('n'); if (!to) return; k.node = to; evAdd('warn', 'cluster', `Key ${k.id} (${UMAP[k.user].name}) moved ${from} → ${to} by Viet Vu.`); S.modal = null; render(); toast(`${k.id} now calls Flickr from ${to}`); },
  'new-dl': () => {
    const m = S.modal;
    const src = m.scope === 'contact' ? CMAP[+m.src].name + ' · all photos' : m.scope === 'album' ? (() => { const a = ALBUMS.find(x => x.id === +m.src); return `${CMAP[a.owner].name} · ${a.title}`; })() : `${S.tray.size} photos from tray`;
    const total = m.scope === 'contact' ? Math.min(CMAP[+m.src].totalPhotos, 400) : m.scope === 'album' ? Math.max(1, ALBUMS.find(x => x.id === +m.src).photos.length * 6) : S.tray.size;

function startDl({ scope, source, size, dest, total }) {
  const id = 'dl-' + (++dlSeq), busy = DLS.some(d => d.user === ME.id && d.state === 'running');
  const d = mkDl({ id, user: ME.id, scope: cap1(scope), source, size, total, done: 0, state: busy ? 'queued' : 'running', dest, node: myKeys()[0].node, started: Date.now() });
  DLS.unshift(d);
  if (dest !== 'ZIP link') { const p = PROVIDERS.find(x => x.name === dest); UPS.unshift(mkUp({ id: 'up-' + (920 + UPS.length), user: ME.id, provider: p.id, dl: id, source, target: p.id === 's3' ? 's3://xflickr-backup/' + source.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '/' : '/XFlickr/' + source, total, done: 0, state: 'running', started: Date.now() })); }
  evAdd('info', 'download', `${id} ${busy ? 'queued' : 'started'} for Viet Vu: ${source} (${total} files, ${size}).`);
  S.role = 'user'; go('dl'); toast(busy ? 'Queued behind your running download' : 'Download started');
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-go]'); if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.dataset.go !== undefined && !el.dataset.act) return go(el.dataset.go, el.dataset.arg ?? null);
  const f = ACT[el.dataset.act]; if (f) { e.stopPropagation(); f(el.dataset.arg, el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.modal) S.modal = null; else if (S.lightbox) S.lightbox = null; else { S.drawer = null; S.notifOpen = false; S.railOpen = false; } render(); return; }
  if (S.lightbox && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !S.modal) { ACT['lb-step'](e.key === 'ArrowRight' ? 1 : -1); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el); });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); FORM[f.dataset.form]?.(new FormData(f)); });
document.addEventListener('mousemove', chartHover);
document.addEventListener('mouseleave', () => { $('#tip').hidden = true; });
