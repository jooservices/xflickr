name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

concurrency:
  group: xflickr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.select.outputs.go }}
      web: ${{ steps.select.outputs.web }}
      integration: ${{ steps.select.outputs.integration }}
      stale: ${{ steps.select.outputs.stale }}
      security_go: ${{ steps.select.outputs.security_go }}
      security_web: ${{ steps.select.outputs.security_web }}
      go_groups: ${{ steps.select.outputs.go_groups }}
      integration_modules: ${{ steps.select.outputs.integration_modules }}
      go_version: ${{ steps.select.outputs.go_version }}
      node_version: ${{ steps.select.outputs.node_version }}
      python_version: ${{ steps.select.outputs.python_version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select jobs and read tool pins
        id: select
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make ci-changes

      - if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure

  static:
    name: static
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.changes.outputs.node_version }}

      - name: Set up Go for Go-related static checks
        if: needs.changes.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.changes.outputs.go_version }}
          cache-dependency-path: backend/go.sum

      - name: Run fast verification stages
        env:
          CI_CHANGED_GO: ${{ needs.changes.outputs.go }}
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: make static

      - if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.changes.outputs.go_version }}
          cache-dependency-path: backend/go.sum

      - name: Lint Go code
        run: make lint

      - if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure

  web-lint:
    name: web-lint
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.changes.outputs.node_version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lint web source
        run: make web-lint

      - if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure

  web-test:
    name: web-test (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.changes.outputs.node_version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run the web test shard
        env:
          WEB_SHARD: ${{ matrix.shard }}
        run: make web-test

      - name: Upload the vitest report when this shard fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-${{ strategy.job-index }}
          path: web/vitest-report.xml
          retention-days: 7
          if-no-files-found: warn

      - if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure

  web-coverage:
    name: web-coverage
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.changes.outputs.node_version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run web unit tests and coverage gate
        run: make web-test

      - if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure

  go-test:
    name: go-test (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.go_groups) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.changes.outputs.go_version }}
          cache-dependency-path: backend/go.sum

      - name: Run Go package test shard
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: make go-test

      - name: Upload this Go coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-${{ matrix.group }}
          path: .tmp/go-coverage/${{ matrix.group }}.out
          if-no-files-found: error
          retention-days: 7

      - if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure

  go-coverage:
    name: go-coverage
    needs: [changes, go-test]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Download Go coverage profiles
        uses: actions/download-artifact@v4
        with:
          pattern: go-coverage-*
          path: .tmp/go-coverage
          merge-multiple: true

      - name: Merge shards and enforce coverage gates
        env:
          COVERAGE_BASE: origin/develop
        run: make go-coverage

      - if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure

  integration:
    name: integration (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.integration_modules) }}
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: xflickr_wtci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xflickr_wtci"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s --health-timeout 10s --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports:
          - 11025:1025
          - 18025:8025
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:8025/api/v1/info"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: xflickr_wtci
      DB_DATABASE: xflickr_wtci
      DB_USER: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ci-only-password
      DB_SSLMODE: disable
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PREFIX: "xflickr_wtci:"
      SEARCH_URL: http://127.0.0.1:9200
      SEARCH_USERNAME: ""
      SEARCH_PASSWORD: ""
      OPENSEARCH_INDEX_PREFIX: xflickr_wtci_
      MAIL_SMTP_ADDR: 127.0.0.1:11025
      MAIL_FROM: no-reply@xflickr.local
      XFLICKR_MASTER_KEYS: ci-v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      XFLICKR_MASTER_KEY_ACTIVE: ci-v1
      NODE_ID: xflickr-ci
      XFLICKR_INTEGRATION_TEST: "1"
      XFLICKR_DBTEST_INTEGRATION_TEST: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.changes.outputs.go_version }}
          cache-dependency-path: backend/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Run this full integration module shard
        env:
          TEST_MODULE: ${{ matrix.module }}
        run: make test-integration

      - name: Upload integration test log
        uses: actions/upload-artifact@v4
        with:
          name: integration-log-${{ matrix.module }}
          path: .tmp/integration/${{ matrix.module }}.jsonl
          if-no-files-found: error
          retention-days: 7

      - if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure

  integration-count:
    name: integration-count
    needs: [changes, integration]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Download module logs
        uses: actions/download-artifact@v4
        with:
          pattern: integration-log-*
          path: .tmp/integration
          merge-multiple: true

      - name: Require more than 100 completed test cases
        run: make integration-count

      - if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure

  stale-check:
    name: stale-check
    needs: changes
    if: needs.changes.outputs.stale == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.changes.outputs.go_version }}
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.changes.outputs.node_version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Regenerate and check freshness
        run: make gen-stale

      - if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure

  security-backend:
    name: security-backend
    needs: changes
    if: needs.changes.outputs.security_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.changes.outputs.go_version }}
          cache-dependency-path: backend/go.sum

      - name: Audit backend dependencies
        run: make security-backend

      - if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure

  security-web:
    name: security-web
    needs: changes
    if: needs.changes.outputs.security_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.changes.outputs.node_version }}

      - name: Audit web dependencies
        run: make security-web

      - if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure

  ci-ok:
    name: ci-ok
    needs:
      - changes
      - static
      - lint
      - web-lint
      - web-test
      - web-coverage
      - go-test
      - go-coverage
      - integration
      - integration-count
      - stale-check
      - security-backend
      - security-web
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Aggregate this run attempt's job conclusions
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_GO: ${{ needs.changes.outputs.go }}
          CI_WEB: ${{ needs.changes.outputs.web }}
          CI_INTEGRATION: ${{ needs.changes.outputs.integration }}
          CI_STALE: ${{ needs.changes.outputs.stale }}
          CI_SECURITY_GO: ${{ needs.changes.outputs.security_go }}
          CI_SECURITY_WEB: ${{ needs.changes.outputs.security_web }}
        run: make ci-aggregate

      - if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure
