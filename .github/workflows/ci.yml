name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Check pinned Go versions
        run: make check-go-version

      - name: Check migration versions are unique and well named
        run: make precheck

      - name: Test the migration version checker
        run: python3 docker/scripts/migration_versions_test.py

      - name: Test Go version check
        run: python3 docker/scripts/test_check_go_version.py

      - name: Check the UI view catalogue
        run: ./docker/scripts/ui-spec-check.sh

      - name: Test the UI view catalogue gate
        run: ./docker/scripts/ui-spec-check.test.sh

      - name: Test the per-package coverage gate
        run: python3 docker/scripts/test_coverage_gate.py

      - name: Test OpenObserve crawl-health freshness alerts
        run: python3 docker/scripts/test_obs_alert_config.py

      - name: Test the worktree environment helper
        run: python3 docker/scripts/test_worktree_env.py

      - name: Test the module cycle checker
        run: python3 docker/scripts/module_cycles_test.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Enforce the module boundaries
        run: make arch-lint

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type check the web
        working-directory: web
        run: npx tsc --noEmit

      - name: Lint the web source
        working-directory: web
        run: npx eslint src

      - name: Run web unit tests
        working-directory: web
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=vitest-report.xml

      - name: Upload the vitest report when the web job fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: web/vitest-report.xml
          retention-days: 7
          if-no-files-found: warn

  go-coverage:
    name: go-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run backend tests and enforce per-package coverage
        run: ./docker/scripts/coverage-gate.sh

      - name: Enforce per-file coverage for changed Go files
        run: python3 docker/scripts/coverage_gate.py .tmp/xflickr-coverage.out --exclude docker/scripts/coverage-exclude.txt --check-files --files-only --base origin/develop --baseline docker/scripts/coverage-file-baseline.txt

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: xflickr_wtci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xflickr_wtci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: xflickr_wtci
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      DB_SSLMODE: disable
      XFLICKR_INTEGRATION_TEST: "1"
      XFLICKR_DBTEST_INTEGRATION_TEST: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Run PostgreSQL integration slice
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          go test -v -p 2 -count=1 ./internal/platform/db/dbtest \
            -run '^(TestOpenUsesMigratedWorktreeDatabase|TestEmptyDatabaseIsCreatedAndDroppedWithoutTouchingWorktreeSchema)$' \
            2>&1 | tee integration.log
          grep -q '^--- PASS: TestOpenUsesMigratedWorktreeDatabase ' integration.log
          grep -q '^--- PASS: TestEmptyDatabaseIsCreatedAndDroppedWithoutTouchingWorktreeSchema ' integration.log
      - name: Upload integration log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-log
          path: backend/integration.log
          if-no-files-found: warn

  stale-check:
    name: stale-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check the UI token specification
        run: make ui-spec-check

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Regenerate code from the OpenAPI contract
        run: make gen

      - name: Fail when generated code is stale
        run: make gen-stale

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Test web security audit wrapper
        run: bash docker/scripts/security-audit-web.test.sh

      - name: Audit web dependencies
        run: bash docker/scripts/security-audit-web.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend vulnerability scan wrapper
        run: bash docker/scripts/security-audit-backend.test.sh

      - name: Scan backend for known vulnerabilities
        run: bash docker/scripts/security-audit-backend.sh
