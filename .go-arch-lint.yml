# go-arch-lint v1 config. Rules: domain <- app <- adapters; modules talk only
# through another module's `app` package. Third-party imports are governed by
# depguard in .golangci.yml.
version: 3

allow:
  depOnAnyVendor: true

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*/gen/.*$"

components:
  identity-domain:   { in: internal/identity/domain/** }
  identity-app:      { in: internal/identity/app/** }
  identity-adapters: { in: internal/identity/adapters/** }
  accounts-domain:   { in: internal/accounts/domain/** }
  accounts-app:      { in: internal/accounts/app/** }
  accounts-adapters: { in: internal/accounts/adapters/** }
  settings-domain:   { in: internal/settings/domain/** }
  settings-app:      { in: internal/settings/app/** }
  settings-adapters: { in: internal/settings/adapters/** }
  schedule-domain:   { in: internal/schedule/domain/** }
  schedule-app:      { in: internal/schedule/app/** }
  schedule-adapters: { in: internal/schedule/adapters/** }
  quota-domain:     { in: internal/quota/domain/** }
  quota-app:        { in: internal/quota/app/** }
  quota-adapters:   { in: internal/quota/adapters/** }
  catalog-domain:   { in: internal/catalog/domain/** }
  catalog-app:      { in: internal/catalog/app/** }
  catalog-adapters: { in: internal/catalog/adapters/** }
  catalog-adapters-gen: { in: internal/catalog/adapters/postgres/gen/** }
  catalog-observation-adapters: { in: internal/catalog/adapters/postgres/observations/** }
  crawl-domain:     { in: internal/crawl/domain/** }
  crawl-app:        { in: internal/crawl/app/** }
  crawl-adapters:   { in: internal/crawl/adapters/** }
  crawl-facets:     { in: internal/crawl/facets/** }
  sharing-domain:   { in: internal/sharing/domain/** }
  sharing-app:      { in: internal/sharing/app/** }
  sharing-adapters: { in: internal/sharing/adapters/** }
  media-domain:     { in: internal/media/domain/** }
  media-app:        { in: internal/media/app/** }
  media-adapters:   { in: internal/media/adapters/** }
  sync-app:         { in: internal/sync/app/** }
  sync-adapters:    { in: internal/sync/adapters/** }
  sync-providertest: { in: internal/sync/providertest/** }
  ai-app:           { in: internal/ai/app/** }
  ai-adapters:      { in: internal/ai/adapters/** }
  platform:
    in:
      - internal/platform/adapters/**
      - internal/platform/api/**
      - internal/platform/audit/**
      - internal/platform/breaker/**
      - internal/platform/config/**
      - internal/platform/crypto/**
      - internal/platform/db/**
      - internal/platform/httpx/**
      - internal/platform/obs/**
      - internal/platform/ops/**
      - internal/platform/outbox/**
      - internal/platform/queue/**
      - internal/platform/sse/**
  # Standalone fake Flickr service used by contract and E2E tests.
  fakeflickr:        { in: internal/fakeflickr/** }
  # Composition root: wires module adapters into runnable roles.
  wiring:            { in: internal/platform/roles/** }
  pkg:               { in: pkg/** }
  migrations:        { in: migrations }
  cmd:               { in: cmd/** }

deps:
  accounts-app:
    mayDependOn: [accounts-domain, platform, pkg, settings-domain]
  accounts-adapters:
    mayDependOn: [accounts-domain, accounts-app, platform, pkg, settings-domain]
  identity-app:
    mayDependOn: [identity-domain, platform, pkg, settings-app]
  identity-adapters:
    mayDependOn: [identity-domain, identity-app, platform, pkg, settings-app]
  settings-app:
    mayDependOn: [settings-domain, platform, pkg, identity-app]
  settings-adapters:
    mayDependOn: [settings-domain, settings-app, platform, pkg, identity-app]
  schedule-app:
    mayDependOn: [schedule-domain, platform, catalog-app, quota-app, quota-domain]
  schedule-adapters:
    mayDependOn: [schedule-domain, schedule-app, platform, pkg]
  quota-app:
    mayDependOn: [quota-domain]
  quota-adapters:
    mayDependOn: [quota-domain, quota-app, platform, pkg]
  catalog-app:
    mayDependOn: [catalog-domain]
  catalog-adapters:
    mayDependOn: [catalog-domain, catalog-app, catalog-adapters-gen]
  catalog-observation-adapters:
    mayDependOn: [catalog-domain, catalog-app, catalog-adapters, catalog-adapters-gen]
  sharing-app:
    mayDependOn: [sharing-domain]
  sharing-adapters:
    mayDependOn: [sharing-domain, sharing-app, platform]
  crawl-domain:
    mayDependOn: [catalog-domain]
  crawl-app:
    mayDependOn: [crawl-domain, settings-domain, catalog-domain, quota-domain, pkg]
  crawl-facets:
    mayDependOn: [crawl-domain, catalog-domain, pkg]
  crawl-adapters:
    mayDependOn: [crawl-domain, crawl-app, platform, settings-app, settings-domain]
  media-app:
    mayDependOn: [media-domain, catalog-domain, catalog-app, sharing-domain]
  media-adapters:
    mayDependOn: [media-domain, media-app, platform, quota-domain, sharing-domain]
  sync-app:
    mayDependOn: [platform]
  sync-adapters:
    mayDependOn: [sync-app, platform]
  sync-providertest:
    mayDependOn: [sync-app]
  ai-adapters:
    mayDependOn: [ai-app, platform]
  platform:
    mayDependOn: [platform, pkg, migrations]
  wiring:
    mayDependOn:
      - accounts-domain
      - accounts-app
      - accounts-adapters
      - identity-domain
      - identity-app
      - identity-adapters
      - settings-domain
      - settings-app
      - settings-adapters
      - schedule-domain
      - schedule-app
      - schedule-adapters
      - quota-domain
      - quota-app
      - quota-adapters
      - catalog-domain
      - catalog-app
      - catalog-adapters
      - crawl-domain
      - crawl-app
      - crawl-adapters
      - crawl-facets
      - sharing-domain
      - sharing-app
      - sharing-adapters
      - media-app
      - media-adapters
      - platform
      - pkg
  pkg:
    mayDependOn: [pkg]
  cmd:
    mayDependOn:
      - identity-app
      - settings-app
      - platform
      - wiring
      - pkg
      - migrations
      - fakeflickr
