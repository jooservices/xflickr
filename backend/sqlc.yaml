version: "2"
sql:
  # Keep query files with their owning module and add one mapping per module.
  - name: platform
    engine: postgresql
    schema: migrations
    queries: internal/platform/adapters/postgres/queries
    gen:
      go:
        package: gen
        out: internal/platform/adapters/postgres/gen
        sql_package: pgx/v5
        emit_interface: true
  - name: catalog
    engine: postgresql
    schema: migrations
    queries: internal/catalog/adapters/postgres/queries
    gen:
      go:
        package: gen
        out: internal/catalog/adapters/postgres/gen
        sql_package: pgx/v5
        emit_interface: true
  - name: settings
    engine: postgresql
    schema: migrations
    queries: internal/settings/adapters/postgres/queries
    gen:
      go:
        package: gen
        out: internal/settings/adapters/postgres/gen
        sql_package: pgx/v5
        emit_interface: true
  - name: sharing
    engine: postgresql
    schema: migrations
    queries: internal/sharing/adapters/postgres/queries
    gen:
      go:
        package: gen
        out: internal/sharing/adapters/postgres/gen
        sql_package: pgx/v5
        emit_interface: true
